version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: doctor_patient_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/doctor_patient_db?schema=public"
      JWT_SECRET: "change-this-in-production"
      JWT_EXPIRES_IN: "24h"
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - db
    command: >
      sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/app.js"

volumes:
  pgdata:
